<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      background: #f6f1e8;
      color: #1f2a30;
    }

    #container {
      width: {{width}}px;
      height: {{height}}px;
      position: relative;
      overflow: hidden;
      padding: 96px 30px 54px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.88), rgba(255, 255, 255, 0.68)),
        repeating-linear-gradient(0deg, rgba(31, 42, 48, 0.045) 0, rgba(31, 42, 48, 0.045) 1px, transparent 1px, transparent 32px);
      border: 1px solid rgba(31, 42, 48, 0.12);
    }

    .header {
      position: absolute;
      left: 28px;
      top: 22px;
      right: 28px;
      z-index: 2;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 24px;
      border-bottom: 1px solid rgba(31, 42, 48, 0.14);
      padding-bottom: 12px;
    }

    .title {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .subtitle {
      font-size: 15px;
      color: #536169;
      white-space: nowrap;
    }

    .word {
      display: inline-block;
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
      text-shadow: 0 2px 8px rgba(255, 255, 255, 0.86);
      margin: 5px 8px;
      vertical-align: baseline;
    }

    .cloud {
      height: calc({{height}}px - 150px);
      width: 100%;
      text-align: justify;
      text-align-last: justify;
      line-height: 1.18;
      overflow: hidden;
    }

    .cloud::after {
      content: "";
      display: inline-block;
      width: 100%;
    }

    .footer {
      position: absolute;
      right: 22px;
      bottom: 16px;
      font-size: 13px;
      color: #6b7479;
    }
  </style>
</head>
<body>
  <div id="container">
    <div class="header">
      <div class="title">{{title}}</div>
      <div class="subtitle">{{subtitle}}</div>
    </div>
    <div class="cloud">
      {{each words word}}
        <span class="word" data-size="{{word.size}}" style="font-size: {{word.size}}px; color: {{word.color}};" title="{{word.count}}次">{{word.text}}</span>
      {{/each}}
    </div>
    <div class="footer">Created by Meilisearch message stats</div>
  </div>
  <script>
    (() => {
      const cloud = document.querySelector('.cloud')
      const words = Array.from(document.querySelectorAll('.word'))
      const targetHeight = cloud.clientHeight

      function applyScale (scale) {
        const vMargin = Math.max(3, Math.min(8, 5 * scale))
        const hMargin = Math.max(6, Math.min(14, 8 * scale))
        for (const word of words) {
          const base = Number(word.dataset.size)
          word.style.fontSize = `${Math.max(10, Math.round(base * scale))}px`
          word.style.margin = `${vMargin}px ${hMargin}px`
        }
      }

      let low = 0.55
      let high = 1
      applyScale(high)
      while (cloud.scrollHeight < targetHeight * 0.94 && high < 3.5) {
        low = high
        high *= 1.18
        applyScale(high)
      }

      for (let i = 0; i < 28; i++) {
        const mid = (low + high) / 2
        applyScale(mid)
        if (cloud.scrollHeight > targetHeight) {
          high = mid
        } else {
          low = mid
        }
      }
      applyScale(low * 0.985)
      document.body.dataset.ready = 'true'
    })()
  </script>
</body>
</html>
