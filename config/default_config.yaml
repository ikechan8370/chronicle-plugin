# Meilisearch 服务配置
meilisearch:
  # 是否启用内置 Meilisearch 二进制服务
  # true: 插件启动时会自动检测、下载（如不存在）并运行内置二进制（开箱即用，无需配置外部服务）
  # false: 连接外部独立部署的 Meilisearch 实例
  embedded: true

  # 内置二进制文件路径。留空则自动在插件 bin/ 目录下查找 meilisearch (Linux/macOS) 或 meilisearch.exe (Windows)
  binPath: ""

  # 当内置二进制不存在时，是否自动从 GitHub Releases 下载预编译可执行文件
  autoDownload: true

  # GitHub Releases 下载加速镜像前缀（例如 https://mirror.ghproxy.com/ 或留空直接连接 GitHub）
  downloadProxy: "https://mirror.ghproxy.com/"

  # Meilisearch 监听/连接的主机地址
  host: "127.0.0.1"

  # Meilisearch 监听/连接的端口
  port: 7700

  # API 密钥 / Master Key。若留空，插件在首次启动内置服务时将自动生成随机安全密钥并持久化
  apiKey: ""

  # 数据文件存储路径（相对于云崽根目录）
  dbPath: "./data/meilisearch/data.ms"

  # 默认消息索引名称
  indexName: "messages"

  # 内存限制与低配服务器调优（专为 1G-4G 内存 VPS 优化）
  # 最大索引内存限制（例如 "256MiB", "512MiB", "1GiB"），默认 "256MiB"，防止默认占用 2/3 系统内存导致 OOM
  maxIndexingMemory: "256MiB"

  # 最大索引并发线程数（默认 1，低配机器建议设为 1，防止多核并发导致瞬时内存激增）
  maxIndexingThreads: 1

  # 是否启用降低索引内存占用的实验性优化（默认 true）
  reduceIndexingMemory: true

# 视觉大模型 (Vision AI) 与对话大模型配置
ai:
  # 视觉模型 (用于群聊新图片自动识别、生成 tags 与文字描述，支持自然语言搜图)
  # 若未配置 API Key，将仅入库图片而不调用视觉识别
  vision:
    provider: "openai"
    baseUrl: "https://api.openai.com/v1"
    apiKey: ""
    model: "gpt-4o-mini"
    supportsResponseFormat: false
    maxRetry: 3

  # 文本大模型 (用于 #学舌、#画像、#群画像 等功能)
  chat:
    # 默认使用的服务商: 'openai' 或 'gemini'
    provider: "openai"

    # OpenAI / DeepSeek / 聚合 API 配置
    openai:
      baseUrl: "https://api.openai.com/v1"
      apiKey: ""
      model: "gpt-4o-mini"
      maxTokens: 4096

    # Google Gemini 配置
    gemini:
      baseUrl: "https://generativelanguage.googleapis.com/v1beta"
      apiKey: ""
      repeatModel: "gemini-2.0-flash"
      descModel: "gemini-2.0-flash"

# 词云与分页参数
wordcloud:
  # 历史词云最大扫描消息数
  historyLimit: 50000
  # 今日词云最大扫描消息数
  todayLimit: 5000
  # 单次查询最大上限
  maxLimit: 500000
  # 历史词云展示词数
  historyWords: 130
  # 今日词云展示词数
  todayWords: 100

# 内置可视化管理面板 (Dashboard) 配置
dashboard:
  # 是否启用内置管理面板（支持后台浏览和检索索引数据、预览图片和 AI 标注）
  enable: true
  # 监听地址（0.0.0.0 允许外部通过 IP 访问，127.0.0.1 仅限本机访问）
  host: "0.0.0.0"
  # 面板监听端口
  port: 7701
  # 访问认证密钥（留空则默认复用 meilisearch.apiKey）
  authKey: ""

# 存储与多媒体持久化配置
storage:
  # 接收并缓存的多媒体（图片/文件）存放路径（相对于云崽根目录）
  receivedDir: "./data/chronicle/received"

  # 是否保存群聊图片到本地磁盘（true: 保存并支持 Vision AI 打标与本地检索预览；false: 仅保留消息元数据）
  saveImage: true

  # 是否保存群聊视频到本地磁盘（默认 false，防止视频过大导致磁盘迅速爆满）
  saveVideo: false

  # 是否保存群文件到本地磁盘（默认 false，防止群文件挤爆硬盘）
  saveFile: false

  # 单个多媒体文件最大下载大小限制（单位: MB，默认 50MB，超过则跳过本地下载）
  maxFileSizeMB: 50

# 分群控制与个性化存储策略
groups:
  # 分群运行模式:
  # - 'all': 默认在所有群启用（除 blacklist 黑名单群外）
  # - 'whitelist': 仅在 whitelist 白名单群中启用
  # - 'blacklist': 仅在 blacklist 黑名单群中禁用，其他群启用
  mode: "all"

  # 白名单群号列表 (仅在 mode: 'whitelist' 时生效，例如: [1049412291, 123456789])
  whitelist: []

  # 黑名单群号列表 (例如: [987654321])
  blacklist: []

  # 是否索引私聊消息 (默认 false，不记录私聊消息)
  indexPrivate: false

  # 特定群聊个性化覆盖规则（以群号为 key）
  # 可为特定群独立设置是否启用、是否存图、是否存视频、是否存文件、是否调用视觉AI等
  rules:
    # 示例群配置（使用时请替换为真实群号）
    # 1049412291:
    #   enabled: true       # 该群是否启用插件 (可单独开启或关闭)
    #   saveImage: true     # 该群是否保存图片到本地
    #   saveVideo: false    # 该群是否保存视频到本地
    #   saveFile: false     # 该群是否保存群文件到本地
    #   vision: true        # 该群图片是否调用 Vision AI 打标 (关闭可节省 Token)
    #   maxFileSizeMB: 20   # 该群单文件最大下载大小 (MB)



